name: Android build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      notes:
        description: "Что нового — покажется на плашке обновления в приложении"
        required: false
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Запись — чтобы выложить APK в релиз с прямой ссылкой.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      # Постоянный ключ подписи из секретов репозитория: с ним новая версия
      # ставится поверх старой и профили остаются. Секрета нет — отладочный ключ.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/strain.jks"
            echo "STRAIN_KEYSTORE_PATH=$RUNNER_TEMP/strain.jks" >> "$GITHUB_ENV"
            echo "Ключ подписи найден"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан случайным отладочным ключом и не встанет поверх прошлой версии"
          fi

      # Номер сборки растёт с каждым запуском — по нему приложение видит, что
      # вышла новая версия. Тысяча сверху: старые сборки были с номером 25.
      - name: Version
        run: |
          echo "STRAIN_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "STRAIN_VERSION_NAME=3.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # Release с R8: debug-сборка Compose на телефоне заметно лагает.
      - name: Build Android APK
        working-directory: android
        env:
          STRAIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Check signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "certificate SHA-256|DN" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: strain-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Прямая ссылка на сам APK — без zip-архива и без входа в GitHub:
      # открыл на Android-телефоне и сразу ставишь. Релиз «android-latest»
      # пересоздаётся на каждой ручной сборке, ссылка остаётся той же:
      # https://github.com/<репозиторий>/releases/download/android-latest/STRAIN.apk
      # Рядом с APK — version.json: номер сборки и «что нового». Его читает само
      # приложение и предлагает обновиться.
      - name: Publish APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk STRAIN.apk
          NOTES="${NOTES_INPUT:-$(git log -1 --format=%s)}"
          jq -n \
            --argjson code "$STRAIN_VERSION_CODE" \
            --arg name "$STRAIN_VERSION_NAME" \
            --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          cat version.json
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-latest STRAIN.apk version.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "STRAIN для Android $STRAIN_VERSION_NAME" \
            --notes "Открой на Android-телефоне и нажми STRAIN.apk. Если телефон спросит — разреши установку из этого источника. Дальше приложение обновляется само. Что нового: $NOTES"
          echo "Прямая ссылка: https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/STRAIN.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
