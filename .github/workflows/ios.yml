name: iOS build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          DEST="$(xcodebuild -showdestinations -project TexasProgram.xcodeproj -scheme TexasProgram 2>/dev/null | sed -n 's/.*platform:iOS Simulator, id:\([^,}]*\).*/platform=iOS Simulator,id:\1/p' | head -n 1)"
          if [ -n "$DEST" ]; then
            echo "Testing on $DEST"
            xcodebuild test \
              -project TexasProgram.xcodeproj \
              -scheme TexasProgram \
              -destination "$DEST" \
              -destination-timeout 120 \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No concrete iOS Simulator is installed; validating an unsigned simulator build instead."
            xcodebuild build \
              -project TexasProgram.xcodeproj \
              -scheme TexasProgram \
              -sdk iphonesimulator \
              CODE_SIGNING_ALLOWED=NO
          fi

  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Build unsigned app
        run: |
          rm -rf TexasProgram/Assets.xcassets
          rm -rf TexasProgram/AppIcon.appiconset TexasProgram/AppIconDark.appiconset TexasProgram/AppIconLight.appiconset
          xcodebuild build \
            -project TexasProgram.xcodeproj \
            -scheme TexasProgram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/TexasProgram.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TexasProgram.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload TexasProgram-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TexasProgram-unsigned
          path: TexasProgram-unsigned.ipa
          if-no-files-found: error
