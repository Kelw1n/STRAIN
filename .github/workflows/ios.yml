name: iOS build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      notes:
        description: "Что нового — покажется на плашке обновления в приложении"
        required: false
        default: ""
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  test:
    # Тесты и сборка на Xcode 16: проверяют, что запасной путь без iOS 26 SDK компилируется.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Упавшие тесты должны краснить проверку: раньше сборка с ошибкой
    # компиляции выглядела зелёной.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          # Берём любой доступный iPhone-симулятор этого Xcode. На macos-14 под
          # Xcode 16.2 их не было вовсе, и тесты молча подменялись сборкой.
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def iphones(tag):
              return [d["udid"] for runtime, items in sorted(devices.items()) if tag in runtime
                      for d in items if d["name"].startswith("iPhone")]
          # Xcode 16 запускает рантаймы до iOS 18 включительно; iOS 26 ему не подходит.
          ids = iphones("iOS-18") or iphones("iOS-17") or iphones("iOS")
          print(ids[-1] if ids else "")
          ')"
          if [ -n "$UDID" ]; then
            echo "Testing on simulator $UDID"
            xcodebuild test \
              -project TexasProgram.xcodeproj \
              -scheme TexasProgram \
              -destination "platform=iOS Simulator,id=$UDID" \
              -destination-timeout 180 \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No iOS Simulator is installed; validating an unsigned simulator build instead."
            xcrun simctl list runtimes || true
            xcodebuild build \
              -project TexasProgram.xcodeproj \
              -scheme TexasProgram \
              -sdk iphonesimulator \
              CODE_SIGNING_ALLOWED=NO
          fi

  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    # Запись — чтобы выложить IPA в релиз с прямой ссылкой.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Самый свежий Xcode 26: только с его SDK на iOS 26 включается настоящее
        # жидкое стекло. Если его на раннере нет — последний Xcode 16.
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      # Номер сборки растёт с каждым запуском — по нему приложение видит, что
      # вышла новая версия. Тысяча сверху, как у Android.
      - name: Version
        run: |
          echo "STRAIN_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "STRAIN_VERSION_NAME=3.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build unsigned app
        run: |
          rm -rf TexasProgram/Assets.xcassets
          rm -rf TexasProgram/AppIcon.appiconset TexasProgram/AppIconDark.appiconset TexasProgram/AppIconLight.appiconset
          xcodebuild build \
            -project TexasProgram.xcodeproj \
            -scheme TexasProgram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$STRAIN_VERSION_CODE" \
            MARKETING_VERSION="$STRAIN_VERSION_NAME"
      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/TexasProgram.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TexasProgram.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload TexasProgram-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TexasProgram-unsigned
          path: TexasProgram-unsigned.ipa
          if-no-files-found: error
      # Прямая ссылка на сам IPA — без zip-архива и без входа в GitHub: её можно
      # открыть на айфоне или вставить в программу установки по ссылке.
      # Рядом с IPA — version.json: номер сборки и «что нового» за последние
      # версии. Его читает приложение и показывает плашку обновления.
      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          cp TexasProgram-unsigned.ipa STRAIN.ipa
          NOTES="${NOTES_INPUT:-$(git log -1 --format=%s)}"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/ios-latest/version.json" -o previous.json || echo '{}' > previous.json
          jq empty previous.json 2>/dev/null || echo '{}' > previous.json
          jq \
            --argjson code "$STRAIN_VERSION_CODE" \
            --arg name "$STRAIN_VERSION_NAME" \
            --arg notes "$NOTES" \
            --arg date "$(date -u +%F)" \
            '(if (.history | type) == "array" then .history
              elif (.versionCode | type) == "number" then [{versionCode, versionName, notes, date}]
              else [] end) as $old
             | {versionCode: $code, versionName: $name, notes: $notes, date: $date,
                history: ([{versionCode: $code, versionName: $name, notes: $notes, date: $date}]
                          + ($old | map(select(.versionCode < $code))))[:30]}' previous.json > version.json
          cat version.json
          gh release delete ios-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ios-latest STRAIN.ipa version.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "STRAIN для iPhone — последняя сборка" \
            --notes "Неподписанный IPA: ставится так же, как прошлые сборки. Сборка из коммита ${GITHUB_SHA::7}."
          echo "Прямая ссылка: https://github.com/$GITHUB_REPOSITORY/releases/download/ios-latest/STRAIN.ipa" >> "$GITHUB_STEP_SUMMARY"
