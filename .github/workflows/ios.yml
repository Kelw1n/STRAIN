name: iOS build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Run tests
        run: |
          xcodebuild test \
            -project TexasProgram.xcodeproj \
            -scheme TexasProgram \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

  unsigned-ipa:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project TexasProgram.xcodeproj \
            -scheme TexasProgram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TexasProgram.app Payload/
          zip -r TexasProgram-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TexasProgram-unsigned
          path: TexasProgram-unsigned.ipa
          if-no-files-found: error
