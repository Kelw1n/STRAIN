name: Exercise art

# Картинки упражнений: серый 3D-манекен, рабочие мышцы красным. Рисует Gemini
# ключом из секрета GEMINI_API_KEY; готовые картинки коммитятся в
# tools/exercise-art/ai/out/ этой же ветки. Запуск — вручную или правкой
# tools/exercise-art/ai/request.json: в нём те же параметры.
on:
  push:
    branches: ["claude/possible-improvements-b00203"]
    paths:
      - "tools/exercise-art/ai/request.json"
  workflow_dispatch:
    inputs:
      keys:
        description: "pilot, all или ключи через запятую"
        default: "pilot"
      model:
        description: "Модель Gemini для картинок"
        default: "gemini-2.5-flash-image"
      force:
        description: "Перерисовать уже готовые"
        type: boolean
        default: false
      reference:
        description: "Ключ готовой картинки — образец стиля (необязательно)"
        default: ""

permissions:
  contents: write

concurrency:
  group: exercise-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          KEYS: ${{ inputs.keys }}
          MODEL: ${{ inputs.model }}
          FORCE: ${{ inputs.force }}
          REFERENCE: ${{ inputs.reference }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          r = json.load(open("tools/exercise-art/ai/request.json"))
          print("keys=" + str(r.get("keys", "pilot")))
          print("model=" + str(r.get("model", "gemini-2.5-flash-image")))
          print("force=" + ("true" if r.get("force") else "false"))
          print("reference=" + str(r.get("reference", "")))
          PY
          else
            { echo "keys=$KEYS"; echo "model=$MODEL"; echo "force=$FORCE"; echo "reference=$REFERENCE"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYS: ${{ steps.params.outputs.keys }}
          MODEL: ${{ steps.params.outputs.model }}
          FORCE: ${{ steps.params.outputs.force }}
          REFERENCE: ${{ steps.params.outputs.reference }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Секрета GEMINI_API_KEY пока нет — рисовать нечем. Добавь его в Settings → Secrets and variables → Actions."
            exit 0
          fi
          pip install --quiet pillow
          args=(--keys "$KEYS" --model "$MODEL")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$REFERENCE" ]; then args+=(--reference "$REFERENCE"); fi
          python3 tools/exercise-art/ai/generate.py "${args[@]}"
      - name: Commit
        if: always()
        env:
          KEYS: ${{ steps.params.outputs.keys }}
        run: |
          set -euo pipefail
          mkdir -p tools/exercise-art/ai/out
          git add tools/exercise-art/ai/out
          if git diff --cached --quiet; then
            echo "Новых картинок нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Картинки упражнений: $KEYS"
          for attempt in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
