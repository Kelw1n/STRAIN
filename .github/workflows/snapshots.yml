name: Screen snapshots

# Снимки экранов ленты и профиля на iPhone и Android — проверка вёрстки без
# телефона в руках. Картинки печатаются в лог строками base64 «SNAP <имя> <i>/<n> …».
on:
  workflow_dispatch:
  push:
    branches: ["claude/possible-improvements-b00203"]
    paths:
      - ".github/workflows/snapshots.yml"
      - "TexasProgramTests/SnapshotTests.swift"
      - "android/app/src/snapshots/**"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Snapshots
        run: |
          set -euo pipefail
          # Большой и маленький iPhone: на SE видно, что ничего не вылезает за края.
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          name = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items()) if "iOS-18" in runtime
                 for d in items if d["name"] == name]
          print(ids[-1] if ids else "")
          ' "$1"
          }
          PRO="$(pick 'iPhone 16 Pro')"
          SE="$(pick 'iPhone SE (3rd generation)')"
          echo "iPhone 16 Pro: $PRO, iPhone SE: $SE"
          xcodebuild build-for-testing \
            -project TexasProgram.xcodeproj -scheme TexasProgram \
            -destination "platform=iOS Simulator,id=$PRO" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          for pair in "pro:$PRO" "se:$SE"; do
            slug="${pair%%:*}"; udid="${pair#*:}"
            [ -n "$udid" ] || continue
            TEST_RUNNER_SNAPSHOTS=1 TEST_RUNNER_SNAPSHOT_DIR="$PWD/snapshots/ios-$slug" \
              xcodebuild test-without-building \
                -project TexasProgram.xcodeproj -scheme TexasProgram \
                -destination "platform=iOS Simulator,id=$udid" \
                -derivedDataPath build \
                -only-testing:TexasProgramTests/SnapshotTests || true
          done
          ls -la snapshots/* || true
      - name: Print snapshots
        if: always()
        run: |
          python3 - <<'PY'
          import base64, glob, os
          for path in sorted(glob.glob("snapshots/**/*.jpg", recursive=True)):
              data = base64.b64encode(open(path, "rb").read()).decode()
              name = os.path.relpath(path, "snapshots")
              chunks = [data[i:i + 4000] for i in range(0, len(data), 4000)]
              for index, chunk in enumerate(chunks):
                  print(f"SNAP {name} {index + 1}/{len(chunks)} {chunk}")
          PY

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Record snapshots
        working-directory: android
        run: gradle -Psnapshots recordPaparazziDebug --continue --stacktrace
      - name: Print snapshots
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("android/app/src/test/snapshots/images/*.png")):
              image = Image.open(path).convert("RGB")
              width = 540
              image = image.resize((width, round(image.height * width / image.width)))
              buffer = io.BytesIO()
              image.save(buffer, "JPEG", quality=60)
              data = base64.b64encode(buffer.getvalue()).decode()
              name = "android/" + os.path.basename(path).replace(".png", ".jpg")
              chunks = [data[i:i + 4000] for i in range(0, len(data), 4000)]
              for index, chunk in enumerate(chunks):
                  print(f"SNAP {name} {index + 1}/{len(chunks)} {chunk}")
          PY

# Повторный прогон — любая правка этого файла в ветке. Прогон 7.
