name: Setup backend

# Разовая настройка ленты: база Neon и сервер Render во Франкфурте, оба рядом
# друг с другом. Нужны секреты RENDER_API_KEY и NEON_API_KEY. Строка подключения
# к базе нигде не печатается: она маскируется в логе и сразу уходит в Render.
on:
  workflow_dispatch:
  push:
    branches: ["claude/possible-improvements-b00203"]
    paths: [".github/workflows/setup-backend.yml"]

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      SERVICE_NAME: strain-feed
      NEON_PROJECT: strain
      BRANCH: ${{ github.ref_name }}
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      # Ключей ещё нет — просто выходим: сценарий запустится снова после их добавления.
      - name: Check keys
        id: keys
        run: |
          if [ -n "$RENDER_API_KEY" ] && [ -n "$NEON_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Нет секретов RENDER_API_KEY и/или NEON_API_KEY — настройка пропущена"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Neon database
        if: steps.keys.outputs.ready == 'true'
        id: neon
        run: |
          set -euo pipefail
          # Ответ при ошибке печатаем коротко: в нём нет секретов, а без него не понять, что не так.
          api() {
            local out code
            out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" "$@")
            code=${out##*$'\n'}
            out=${out%$'\n'*}
            if [ "$code" -ge 400 ]; then echo "::error::Neon $code: $(printf '%s' "$out" | head -c 400)" >&2; return 1; fi
            printf '%s' "$out"
          }
          # Новые аккаунты Neon живут в «организации»: без её id список проектов не отдают.
          org=$(api "https://console.neon.tech/api/v2/users/me/organizations" | jq -r '.organizations[0].id // empty')
          query=""
          [ -n "$org" ] && query="org_id=$org"
          projects=$(api "https://console.neon.tech/api/v2/projects?$query")
          id=$(echo "$projects" | jq -r --arg n "$NEON_PROJECT" '.projects[] | select(.name == $n) | .id' | head -1)
          if [ -z "$id" ]; then
            echo "Создаю проект Neon «$NEON_PROJECT» во Франкфурте"
            body=$(jq -n --arg name "$NEON_PROJECT" --arg org "$org" '{project: ({name: $name, region_id: "aws-eu-central-1", pg_version: 16} + (if $org == "" then {} else {org_id: $org} end))}')
            created=$(api -X POST https://console.neon.tech/api/v2/projects -d "$body")
            id=$(echo "$created" | jq -r '.project.id')
            uri=$(echo "$created" | jq -r '.connection_uris[0].connection_uri')
          else
            echo "Проект Neon уже есть: $id"
            branch=$(api "https://console.neon.tech/api/v2/projects/$id/branches" | jq -r '.branches[] | select(.default == true) | .id' | head -1)
            dbs=$(api "https://console.neon.tech/api/v2/projects/$id/branches/$branch/databases")
            db=$(echo "$dbs" | jq -r '.databases[0].name')
            role=$(echo "$dbs" | jq -r '.databases[0].owner_name')
            uri=$(api "https://console.neon.tech/api/v2/projects/$id/connection_uri?branch_id=$branch&database_name=$db&role_name=$role" | jq -r '.uri')
          fi
          [ -n "$uri" ] && [ "$uri" != "null" ] || { echo "::error::Neon не отдал строку подключения"; exit 1; }
          echo "::add-mask::$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "Neon готов: проект $id"

      - name: Render service
        if: steps.keys.outputs.ready == 'true'
        id: render
        env:
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
        run: |
          set -euo pipefail
          api() {
            local out code
            out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" "$@")
            code=${out##*$'\n'}
            out=${out%$'\n'*}
            if [ "$code" -ge 400 ]; then echo "::error::Render $code: $(printf '%s' "$out" | head -c 400)" >&2; return 1; fi
            printf '%s' "$out"
          }
          owner=$(api "https://api.render.com/v1/owners?limit=20" | jq -r '.[0].owner.id')
          [ -n "$owner" ] && [ "$owner" != "null" ] || { echo "::error::Render не отдал аккаунт — проверь ключ"; exit 1; }
          service=$(api "https://api.render.com/v1/services?name=$SERVICE_NAME&limit=20" | jq -r '.[0].service.id // empty')
          if [ -z "$service" ]; then
            echo "Создаю сервис Render «$SERVICE_NAME» во Франкфурте"
            body=$(jq -n --arg owner "$owner" --arg name "$SERVICE_NAME" --arg repo "$REPO_URL" --arg branch "$BRANCH" --arg db "$DATABASE_URL" '{
              type: "web_service", name: $name, ownerId: $owner, repo: $repo, branch: $branch,
              rootDir: "server", autoDeploy: "yes",
              buildFilter: {paths: ["server/**"], ignoredPaths: []},
              envVars: [{key: "DATABASE_URL", value: $db}, {key: "NODE_VERSION", value: "20"}],
              serviceDetails: {
                runtime: "node", plan: "free", region: "frankfurt", healthCheckPath: "/health",
                envSpecificDetails: {buildCommand: "npm install", startCommand: "npm start"}
              }
            }')
            created=$(api -X POST https://api.render.com/v1/services -d "$body")
            service=$(echo "$created" | jq -r '.service.id')
          else
            echo "Сервис уже есть: $service — обновляю базу и ветку"
            api -X PUT "https://api.render.com/v1/services/$service/env-vars/DATABASE_URL" -d "$(jq -n --arg v "$DATABASE_URL" '{value: $v}')" > /dev/null
            # Пересборка только на правки сервера: коммиты в приложения его не трогают.
            api -X PATCH "https://api.render.com/v1/services/$service" -d "$(jq -n --arg b "$BRANCH" '{branch: $b, rootDir: "server", buildFilter: {paths: ["server/**"], ignoredPaths: []}}')" > /dev/null
            api -X POST "https://api.render.com/v1/services/$service/deploys" -d '{}' > /dev/null
          fi
          url=$(api "https://api.render.com/v1/services/$service" | jq -r '.serviceDetails.url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Адрес сервера: $url"

      - name: Wait for the server
        if: steps.keys.outputs.ready == 'true'
        env:
          URL: ${{ steps.render.outputs.url }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 30 "$URL/health" || true)
            # Старая версия отвечает, пока новая собирается, — ждём свежую.
            if echo "$body" | grep -q '"social":true' && echo "$body" | grep -q '"api":5'; then
              echo "Сервер отвечает и база подключена: $URL"
              echo "### Лента готова: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Жду запуска ($i)…"
            sleep 20
          done
          echo "::error::Сервер не поднялся за 20 минут — посмотри логи сборки в Render"
          exit 1

      # Живая проверка: тестовый профиль, фото, пост, лайк, комментарий, лента —
      # и всё удаляется за собой.
      - name: Smoke test
        if: steps.keys.outputs.ready == 'true'
        env:
          URL: ${{ steps.render.outputs.url }}
        run: |
          set -euo pipefail
          name="smoke_$(date +%s)"
          reg=$(curl -fsS -X POST "$URL/v2/register" -H 'Content-Type: application/json' -d "{\"username\":\"$name\"}")
          token=$(echo "$reg" | jq -r .token)
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          printf '\xff\xd8\xff\xe0smoke\xff\xd9' > photo.jpg
          image=$(curl -fsS -X POST "$URL/v2/images" -H "$auth" -H 'Content-Type: image/jpeg' --data-binary @photo.jpg | jq -r .id)
          post=$(curl -fsS -X POST "$URL/v2/posts" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"smoke\",\"title\":\"Проверка\",\"volumeKg\":100,\"durationSeconds\":600,\"photos\":[\"$image\"],\"workout\":{\"exercises\":[{\"name\":\"Жим лёжа\",\"sets\":[{\"reps\":5,\"weight\":20}]}]}}" | jq -r .id)
          curl -fsS -X POST "$URL/v2/posts/$post/like" -H "$auth" | jq -e '.likes == 1' > /dev/null
          curl -fsS -X POST "$URL/v2/posts/$post/comments" -H "$auth" -H 'Content-Type: application/json' -d '{"text":"ok"}' > /dev/null
          curl -fsS "$URL/v2/feed" | jq -e --arg id "$post" '[.posts[].id] | index($id) != null' > /dev/null
          curl -fsS "$URL/v2/images/$image" -o back.jpg && cmp photo.jpg back.jpg
          # Ответ под комментарием и личное сообщение второму тестовому профилю.
          root=$(curl -fsS "$URL/v2/posts/$post/comments" -H "$auth" | jq -r '.[0].id')
          curl -fsS -X POST "$URL/v2/posts/$post/comments" -H "$auth" -H 'Content-Type: application/json' -d "{\"text\":\"reply\",\"replyTo\":\"$root\"}" | jq -e --arg r "$root" '.replyTo == $r' > /dev/null
          friend="smoke2_$(date +%s)"
          token2=$(curl -fsS -X POST "$URL/v2/register" -H 'Content-Type: application/json' -d "{\"username\":\"$friend\"}" | jq -r .token)
          echo "::add-mask::$token2"
          curl -fsS -X POST "$URL/v2/chats/$friend/messages" -H "$auth" -H 'Content-Type: application/json' -d '{"text":"hi","clientId":"smoke"}' > /dev/null
          curl -fsS "$URL/v2/chats/unread" -H "Authorization: Bearer $token2" | jq -e '.unread == 1' > /dev/null
          curl -fsS "$URL/v2/chats/$name/messages" -H "Authorization: Bearer $token2" | jq -e '.messages[0].text == "hi"' > /dev/null
          # Фото в личном сообщении.
          dm=$(curl -fsS -X POST "$URL/v2/images" -H "$auth" -H 'Content-Type: image/jpeg' --data-binary @photo.jpg | jq -r .id)
          curl -fsS -X POST "$URL/v2/chats/$friend/messages" -H "$auth" -H 'Content-Type: application/json' -d "{\"text\":\"\",\"image\":\"$dm\"}" | jq -e --arg i "$dm" '.image == $i' > /dev/null
          # Голосовое в личном сообщении: звук, длительность и волна.
          printf '....ftypM4A smoke voice' > voice.m4a
          voice=$(curl -fsS -X POST "$URL/v2/voices?durationMs=1500&waveform=0a5f" -H "$auth" -H 'Content-Type: audio/mp4' --data-binary @voice.m4a | jq -r .id)
          curl -fsS -X POST "$URL/v2/chats/$friend/messages" -H "$auth" -H 'Content-Type: application/json' -d "{\"voice\":\"$voice\"}" | jq -e '.voice.durationMs == 1500' > /dev/null
          curl -fsS "$URL/v2/voices/$voice" -o back.m4a && cmp voice.m4a back.m4a
          # Ответ на сообщение, реакция, «печатает» и изменения с прошлого раза.
          first=$(curl -fsS "$URL/v2/chats/$name/messages" -H "Authorization: Bearer $token2" | jq -r '.messages[-1].id')
          since=$(curl -fsS "$URL/v2/chats/$friend/messages" -H "$auth" | jq -r .serverTime)
          curl -fsS -X POST "$URL/v2/chats/$name/typing" -H "Authorization: Bearer $token2" > /dev/null
          curl -fsS -X POST "$URL/v2/chats/$name/messages" -H "Authorization: Bearer $token2" -H 'Content-Type: application/json' \
            -d "{\"text\":\"yo\",\"replyTo\":\"$first\"}" | jq -e --arg f "$first" '.replyTo.id == $f' > /dev/null
          curl -fsS -X POST "$URL/v2/messages/$first/react" -H "Authorization: Bearer $token2" -H 'Content-Type: application/json' \
            -d '{"emoji":"🔥"}' | jq -e '.reactions[0].emoji == "🔥"' > /dev/null
          curl -fsS "$URL/v2/chats/$friend/messages?since=$since" -H "$auth" | jq -e '(.messages | length) >= 2' > /dev/null
          # Тренируется сейчас, рейтинг недели и активность.
          curl -fsS -X POST "$URL/v2/users/$name/follow" -H "Authorization: Bearer $token2" > /dev/null
          curl -fsS -X PUT "$URL/v2/me/live" -H "$auth" -H 'Content-Type: application/json' -d '{"title":"День 1","exercise":"Присед","done":3,"total":5}' > /dev/null
          curl -fsS "$URL/v2/live" -H "Authorization: Bearer $token2" | jq -e '.[0].live.exercise == "Присед"' > /dev/null
          curl -fsS "$URL/v2/chats/$name/messages" -H "Authorization: Bearer $token2" | jq -e '.live.done == 3' > /dev/null
          curl -fsS -X DELETE "$URL/v2/me/live" -H "$auth" > /dev/null
          curl -fsS -X PATCH "$URL/v2/me" -H "$auth" -H 'Content-Type: application/json' -d '{"stats":{"week":"smoke","workouts":2,"volumeKg":1000}}' > /dev/null
          curl -fsS "$URL/v2/leaderboard" -H "Authorization: Bearer $token2" | jq -e '[.[].stats.workouts] | index(2) != null' > /dev/null
          curl -fsS "$URL/v2/activity" -H "$auth" | jq -e '[.items[].kind] | index("follow") != null' > /dev/null
          curl -fsS "$URL/v2/badges" -H "$auth" | jq -e '.activity >= 1' > /dev/null
          # Совместная тренировка: приглашение, принятие, пост «вместе с».
          together=$(curl -fsS -X POST "$URL/v2/users/$friend/together" -H "$auth" | jq -r .id)
          curl -fsS "$URL/v2/together" -H "Authorization: Bearer $token2" | jq -e --arg t "$together" '.incoming[0].id == $t' > /dev/null
          curl -fsS -X POST "$URL/v2/together/$together/accept" -H "Authorization: Bearer $token2" | jq -e '.status == "accepted"' > /dev/null
          curl -fsS -X POST "$URL/v2/posts" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"smoke-together\",\"title\":\"Вдвоём\",\"together\":\"$together\"}" | jq -e --arg f "$friend" '.partner.username == $f' > /dev/null
          curl -fsS -X DELETE "$URL/v2/me" -H "Authorization: Bearer $token2" > /dev/null
          start=$(date +%s%N); curl -fsS "$URL/v2/feed" > /dev/null; end=$(date +%s%N)
          echo "Лента ответила за $(( (end - start) / 1000000 )) мс"
          curl -fsS -X DELETE "$URL/v2/me" -H "$auth" > /dev/null
          echo "Живая проверка прошла: регистрация, фото, пост, лайк, комментарий, ответ, сообщения, голосовое, реакции, «печатает», тренируется сейчас, рейтинг, активность, совместная тренировка, лента"
          echo "Живая проверка прошла" >> "$GITHUB_STEP_SUMMARY"

# Повторный запуск — любая правка этого файла в ветке. Попытка 8.
