name: Android performance

# Замер плавности на эмуляторе: одна и та же последовательность действий для
# прошлой версии и текущей — вкладки, прокрутки, план, отметки подходов.
# По каждому сценарию — время кадров UI-потока из dumpsys gfxinfo.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Коммит для сравнения"
        default: "6b58ca2"
  push:
    branches: ["claude/possible-improvements-b00203"]
    paths:
      - ".github/workflows/perf.yml"
      - "android/perf/**"

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASELINE: ${{ github.event.inputs.baseline || '6b58ca2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build current
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/current.apk"

      - name: Build baseline
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASELINE"
          cd "$RUNNER_TEMP/base/android"
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/baseline.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pillow
        run: pip install pillow

      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 android/perf/drive.py baseline.apk perf-base || true
            adb uninstall com.texasprogram.app || true
            python3 android/perf/drive.py current.apk perf-current || true

      - name: Summary
        if: always()
        run: |
          echo "## До (${BASELINE})" >> "$GITHUB_STEP_SUMMARY"
          cat perf-base/report.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "## После ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          cat perf-current/report.md >> "$GITHUB_STEP_SUMMARY" || true

# Повторный прогон — любая правка этого файла в ветке. Прогон 1.
